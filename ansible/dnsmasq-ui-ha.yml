---
- name: Setup HA dnsmasq-ui with GlusterFS and Docker
  hosts: dns_servers
  become: yes
  gather_facts: yes

  vars:
    glusterfs_volume: dnsmasq-ui
    glusterfs_brick_path: /data/glusterfs
    glusterfs_mount_path: /opt/dnsmasq-ui-data
    ui_docker_path: /opt/dnsmasq-ui
    keepalive_vip: "{{ keepalive_vip | default('192.168.0.252') }}"

  tasks:
    # =====================================================================
    # Phase 1: GlusterFS Setup
    # =====================================================================

    - name: Install GlusterFS packages
      apt:
        name:
          - glusterfs-server
          - glusterfs-client
        state: present
        update_cache: yes

    - name: Create GlusterFS brick directory
      file:
        path: "{{ glusterfs_brick_path }}"
        state: directory
        mode: '0755'

    - name: Start and enable glusterd service
      systemd:
        name: glusterd
        state: started
        enabled: yes

    - name: Wait for glusterd to be ready
      wait_for:
        port: 24007
        host: localhost
        timeout: 30

    # Peer probe on dns01 only
    - name: Peer probe dns02 into cluster
      command: gluster peer probe dns02
      register: peer_probe_result
      changed_when: "'already in peer' not in peer_probe_result.stdout and 'rejected' not in peer_probe_result.stderr"
      when: inventory_hostname == groups['dns_servers'][0]
      failed_when: false

    - name: Peer probe dns03 into cluster
      command: gluster peer probe dns03
      register: peer_probe_result
      changed_when: "'already in peer' not in peer_probe_result.stdout and 'rejected' not in peer_probe_result.stderr"
      when: inventory_hostname == groups['dns_servers'][0]
      failed_when: false

    # Create and start volume on dns01 only
    - name: Create GlusterFS volume
      command: >
        gluster volume create {{ glusterfs_volume }} replica 3
        dns01:{{ glusterfs_brick_path }}
        dns02:{{ glusterfs_brick_path }}
        dns03:{{ glusterfs_brick_path }}
        force
      register: volume_create
      when: inventory_hostname == groups['dns_servers'][0]
      failed_when:
        - volume_create.rc != 0
        - "'already exists' not in volume_create.stderr"

    - name: Start GlusterFS volume
      command: gluster volume start {{ glusterfs_volume }}
      when: inventory_hostname == groups['dns_servers'][0]
      register: volume_start
      changed_when: "'already started' not in volume_start.stderr"
      failed_when:
        - volume_start.rc != 0
        - "'already started' not in volume_start.stderr"

    - name: Wait for volume to be available
      wait_for:
        timeout: 30
      when: inventory_hostname == groups['dns_servers'][0]

    # Mount on all servers
    - name: Create GlusterFS mount directory
      file:
        path: "{{ glusterfs_mount_path }}"
        state: directory
        mode: '0755'

    - name: Mount GlusterFS volume
      mount:
        name: "{{ glusterfs_mount_path }}"
        src: "localhost:{{ glusterfs_volume }}"
        fstype: glusterfs
        opts: "defaults,_netdev"
        state: mounted

    - name: Verify mount
      command: df {{ glusterfs_mount_path }}
      register: mount_check
      changed_when: false

    # =====================================================================
    # Phase 2: Docker Setup
    # =====================================================================

    - name: Install Docker and dependencies
      apt:
        name:
          - docker.io
          - python3-docker
          - python3-dotenv
          - git
          - curl
        state: present
        update_cache: yes

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create UI application directory
      file:
        path: "{{ ui_docker_path }}"
        state: directory
        mode: '0755'

    - name: Create SSH directory for container
      file:
        path: "{{ ui_docker_path }}/.ssh"
        state: directory
        mode: '0700'

    - name: Copy SSH private key to Docker mount point
      copy:
        src: "{{ ssh_key | expanduser }}"
        dest: "{{ ui_docker_path }}/.ssh/id_rsa"
        mode: '0600'
      vars:
        ssh_key: "{{ lookup('env', 'SSH_KEY') | default('~/.ssh/id_rsa', true) }}"
      ignore_errors: true

    - name: Check if repo already cloned
      stat:
        path: "{{ ui_docker_path }}/app-multi-zone.py"
      register: app_exists

    - name: Clone dnsmasq-ui repository
      git:
        repo: https://github.com/alpauna/dnsmasq-ui.git
        dest: "{{ ui_docker_path }}"
        version: master
      when: not app_exists.stat.exists
      ignore_errors: true

    - name: Update repository if already exists
      command:
        cmd: git pull
        chdir: "{{ ui_docker_path }}"
      when: app_exists.stat.exists
      register: git_pull
      changed_when: "'Already up to date' not in git_pull.stdout"
      ignore_errors: true

    - name: Create docker-compose.yml for dnsmasq-ui
      copy:
        content: |
          version: '3.8'

          services:
            dnsmasq-ui:
              image: python:3.11-slim
              container_name: dnsmasq-ui
              restart: unless-stopped
              ports:
                - "5000:5000"
              volumes:
                - {{ glusterfs_mount_path }}/zones.json:/etc/dnsmasq-ui/zones.json
                - {{ ui_docker_path }}/.ssh/id_rsa:/root/.ssh/id_rsa:ro
                - {{ ui_docker_path }}:/app
              working_dir: /app
              environment:
                - ZONES_CONFIG=/etc/dnsmasq-ui/zones.json
                - SSH_USER={{ ssh_user }}
                - FLASK_ENV=production
              command: bash -c "pip install -q -r requirements.txt && python app-multi-zone.py"
        dest: "{{ ui_docker_path }}/docker-compose.yml"
      vars:
        ssh_user: "{{ lookup('env', 'SSH_USER') | default('debian', true) }}"

    - name: Pull base image
      command: docker pull python:3.11-slim

    - name: Start dnsmasq-ui container
      command: docker compose up -d
      args:
        chdir: "{{ ui_docker_path }}"

    - name: Wait for UI to be ready
      uri:
        url: "http://localhost:5000/api/status"
        status_code: 200
      register: ui_ready
      until: ui_ready.status == 200
      retries: 10
      delay: 5
      changed_when: false

    # =====================================================================
    # Phase 3: Keepalived Update for UI Health Check
    # =====================================================================

    - name: Update keepalived config with UI health check
      lineinfile:
        path: /etc/keepalived/keepalived.conf
        insertbefore: "vrrp_instance DNS_VIP"
        line: |
          vrrp_script check_ui {
            script "curl -sf http://localhost:5000/api/status > /dev/null"
            interval 10
            weight -20
            fall 2
            rise 2
          }
        state: present
      notify: restart keepalived

    - name: Add UI script tracking to vrrp_instance
      blockinfile:
        path: /etc/keepalived/keepalived.conf
        marker: "    # {mark} ANSIBLE MANAGED UI TRACKING BLOCK"
        insertafter: "track_processes"
        block: |
              track_script {
                check_ui
              }
        state: present
      notify: restart keepalived

    - name: Verify UI API is accessible from localhost
      command: curl -sf http://localhost:5000/api/status
      register: ui_check
      changed_when: false
      retries: 3
      delay: 2

  handlers:
    - name: restart keepalived
      systemd:
        name: keepalived
        state: restarted
