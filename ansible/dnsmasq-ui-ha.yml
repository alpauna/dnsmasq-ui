---
# Deploy dnsmasq-ui to all DNS servers so the dashboard is reachable on the
# existing keepalived VIP regardless of which node is currently DNS master,
# not just whichever one happened to have it installed manually.
#
# Deliberately does NOT touch keepalived.conf or tie the dashboard's health
# into DNS failover — a dnsmasq-ui crash recovers via systemd's
# Restart=on-failure in place, without moving the VIP (and therefore DNS
# traffic) for a UI-only problem. See app-multi-zone.py's
# _is_local_vrrp_master()/poller gating for how only the currently-active
# node avoids redundant polling of tracked devices, independent of this.
#
# Supersedes the old dnsmasq-ui-ha.yml, which deployed Docker + GlusterFS —
# never actually run in production; what's real (192.168.0.233) is a bare
# systemd service + venv, which is what this playbook now matches.

- name: Deploy dnsmasq-ui dashboard to all DNS servers
  hosts: dns_servers
  become: yes
  gather_facts: yes

  vars:
    ui_path: /opt/dnsmasq-ui
    ssh_user: "{{ lookup('env', 'SSH_USER') | default('debian', true) }}"
    ssh_key_src: "{{ lookup('env', 'SSH_KEY') | default('~/.ssh/id_rsa', true) }}"
    keepalive_vip: "192.168.0.230"
    dynamic_poll_interval: 3600
    # Already-provisioned node other hosts fetch existing state from (admin
    # password, vault, SMTP creds) so a fresh node doesn't start unconfigured
    # and a failover into it doesn't lose data. Change if dns03 is ever
    # rebuilt from scratch and another node becomes the source of truth.
    primary_host: dns03
    # Public URL for links in background-context emails (e.g. the
    # vault-locked notification) — reachable via Pangolin, not just the
    # internal VIP, so a notification email is actually clickable from
    # anywhere rather than only from inside the LAN.
    dashboard_url: "https://dnsmasq.alshowto.com"
    # Only trust X-Forwarded-* headers (client IP, scheme, host — used for
    # both request logging and Flask-WTF's CSRF origin check) from this
    # host — where Pangolin's newt tunnel agent actually runs (middle-01).
    # Anything else connecting directly (e.g. another LAN host) has its
    # X-Forwarded-* headers ignored rather than blindly trusted, since
    # those are otherwise trivially spoofable by any direct connection.
    trusted_proxies: "192.168.0.250"
    # e.g. '/dnsmasq-ui' if ever served under a subpath rather than at the
    # domain root — dnsmasq.alshowto.com currently serves at root, so this
    # is unused today.
    proxy_path_prefix: ""
    # Subnet "presence" for a DNS server that otherwise only sits on the
    # LAN: a persistent VLAN sub-interface (netplan), so it gets a real
    # IPv4/IPv6 (SLAAC) address on another subnet without another
    # physical/virtual NIC -- the Proxmox bridge these VMs sit on is
    # already VLAN-aware (trunk mode), so this is the guest-OS-level
    # equivalent of adding a tagged NIC in the Proxmox UI, just scriptable
    # from here instead of a console trip per subnet. Add an entry per
    # host that needs one; wire the matching subnet's `interface` field
    # in zones.json separately (see README) so poll_subnets() picks it up.
    vlan_presence:
      dns01:
        - vlan_id: 7
          name: mgmt

  tasks:
    - name: Install system packages
      apt:
        name:
          - git
          - python3-venv
          - python3-pip
          - docker.io
        state: present
        update_cache: yes

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    # The app runs docker via passwordless sudo rather than adding the
    # service account to the docker group (that'd be a standing
    # effectively-root-equivalent grant) — see DOCKER_CMD in
    # app-multi-zone.py. Confirm that's actually available rather than
    # assume every host was provisioned identically.
    - name: Verify passwordless sudo works for docker
      command: sudo -n docker ps
      changed_when: false

    - name: Check if repo already cloned
      stat:
        path: "{{ ui_path }}/app-multi-zone.py"
      register: app_exists

    - name: Create app directory with correct ownership (/opt is root-owned,
        so this has to happen as root before a non-root git clone into it can work)
      file:
        path: "{{ ui_path }}"
        state: directory
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: '0755'
      when: not app_exists.stat.exists

    - name: Clone dnsmasq-ui repository
      git:
        repo: https://github.com/alpauna/dnsmasq-ui.git
        dest: "{{ ui_path }}"
        version: master
      become_user: "{{ ssh_user }}"
      when: not app_exists.stat.exists

    - name: Pull latest if already cloned
      command:
        cmd: git pull origin master
        chdir: "{{ ui_path }}"
      become_user: "{{ ssh_user }}"
      when: app_exists.stat.exists
      register: git_pull
      changed_when: "'Already up to date' not in git_pull.stdout"
      failed_when: false
      notify: reload and restart dnsmasq-ui

    - name: Create Python virtual environment
      command:
        cmd: python3 -m venv {{ ui_path }}/venv
        creates: "{{ ui_path }}/venv/bin/python"

    - name: Install Python dependencies
      pip:
        requirements: "{{ ui_path }}/requirements.txt"
        virtualenv: "{{ ui_path }}/venv"
      notify: reload and restart dnsmasq-ui

    # The app builds this automatically on first use anyway
    # (_ensure_legacy_ssh_image()) — doing it here too so it's ready before
    # a failover, rather than adding ~15s of build time to whatever poll
    # first needs it after this node becomes active.
    - name: Check if legacy-ssh image already exists
      command: /usr/bin/sudo /usr/bin/docker image inspect dnsmasq-ui-legacy-ssh
      register: legacy_ssh_image_check
      failed_when: false
      changed_when: false

    - name: Build legacy-ssh image (for devices needing an older OpenSSH client, e.g. old switches)
      command: /usr/bin/sudo /usr/bin/docker build -t dnsmasq-ui-legacy-ssh {{ ui_path }}/docker/legacy-ssh
      when: legacy_ssh_image_check.rc != 0

    - name: Ensure .ssh directory exists
      file:
        path: "/home/{{ ssh_user }}/.ssh"
        state: directory
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: '0700'

    - name: Copy SSH private key (already trusted on every host this app manages)
      copy:
        src: "{{ ssh_key_src }}"
        dest: "/home/{{ ssh_user }}/.ssh/id_rsa"
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: '0600'

    # -------------------------------------------------------------------
    # Seed state from the primary node on first install only. Ongoing sync
    # after this is handled by the app itself (_sync_peer_state(), pushed
    # on every save) — this is just so a brand-new node doesn't start with
    # no admin password / uninitialized vault if a failover happens before
    # its first save event.
    # -------------------------------------------------------------------

    - name: Read state files from primary
      slurp:
        src: "{{ ui_path }}/{{ state_file }}"
      loop:
        - auth.json
        - device-credentials.json
        - smtp.env
      loop_control:
        loop_var: state_file
        label: "{{ state_file }}"
      delegate_to: "{{ primary_host }}"
      register: primary_state_files
      when: inventory_hostname != primary_host
      failed_when: false

    - name: Seed state files from primary
      copy:
        content: "{{ item.content | b64decode }}"
        dest: "{{ ui_path }}/{{ item.state_file }}"
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: '0600'
      loop: "{{ primary_state_files.results | default([]) }}"
      loop_control:
        label: "{{ item.state_file | default('unknown') }}"
      when:
        - inventory_hostname != primary_host
        - item.content is defined

    - name: Deploy systemd unit
      template:
        src: templates/dnsmasq-ui.service.j2
        dest: /etc/systemd/system/dnsmasq-ui.service
      notify: reload and restart dnsmasq-ui

    - name: Enable dnsmasq-ui service
      systemd:
        name: dnsmasq-ui
        enabled: yes
        daemon_reload: yes

    - name: Ensure dnsmasq-ui is started
      systemd:
        name: dnsmasq-ui
        state: started

    - name: Create persistent VLAN sub-interfaces for subnet presence
      copy:
        content: |
          network:
            version: 2
            vlans:
              eth0.{{ item.vlan_id }}:
                id: {{ item.vlan_id }}
                link: eth0
        dest: "/etc/netplan/90-presence-{{ item.name }}.yaml"
        owner: root
        group: root
        mode: '0600'
      loop: "{{ vlan_presence[inventory_hostname] | default([]) }}"
      loop_control:
        label: "{{ item.name }} (VLAN {{ item.vlan_id }})"
      notify: apply netplan

  handlers:
    - name: reload and restart dnsmasq-ui
      systemd:
        name: dnsmasq-ui
        daemon_reload: yes
        state: restarted

    - name: apply netplan
      command: netplan apply
